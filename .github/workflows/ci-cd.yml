name: CI / CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  ci:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            admin/package-lock.json

      - name: Backend tests and build
        working-directory: backend
        run: |
          npm install
          npm test -- --passWithNoTests
          npm run build

      - name: Admin build
        working-directory: admin
        env:
          NUXT_PUBLIC_API_BASE: http://localhost:3001/api
        run: |
          npm install
          npm run build

  deploy:
    name: Deploy production
    needs: ci
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_SSH_KEY" || { echo "Missing secret DEPLOY_SSH_KEY"; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printenv DEPLOY_SSH_KEY > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 185.211.4.81 >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          SKIP_ENV_SYNC: "1"
        run: |
          chmod +x scripts/deploy-to-prod.sh scripts/deploy.sh
          ./scripts/deploy-to-prod.sh

      - name: Aurel live production smoke report
        if: contains(github.event.head_commit.message, '[aurel-live-smoke]')
        run: |
          echo "Waiting for Aurel Acquisition first production tick..."
          sleep 75
          ssh root@185.211.4.81 'bash -s' <<'REMOTE'
          set -euo pipefail

          echo "=== Aurel live smoke: acquisition progress ==="
          EMPTY_POLLS=0
          for i in $(seq 1 8); do
            SNAPSHOT="$(docker exec -i mailer-backend node - <<'NODE'
          const Database = require('better-sqlite3');
          const db = new Database('/app/data/mailer.sqlite', { readonly: true });
          const job = db.prepare(`
            SELECT id, status, listName, found, merged, skipped, searches, scrapes,
                   message, createdAt, finishedAt, aurelProductName, aurelActivity,
                   aurelCampaignIds, aurelPostProcessedAt
            FROM discovery_jobs
            WHERE listName LIKE 'Aurel acquisition · %'
            ORDER BY createdAt DESC
            LIMIT 1
          `).get();
          if (!job) {
            console.log(JSON.stringify({ found: false, status: 'none' }));
          } else {
            console.log(JSON.stringify({
              found: true,
              id: job.id,
              status: job.status,
              product: job.aurelProductName,
              activity: job.aurelActivity,
              prospectsFound: job.found,
              merged: job.merged,
              skipped: job.skipped,
              searches: job.searches,
              scrapes: job.scrapes,
              message: job.message,
              createdAt: job.createdAt,
              finishedAt: job.finishedAt,
              postProcessedAt: job.aurelPostProcessedAt,
              hasCampaigns: Boolean(job.aurelCampaignIds),
            }));
          }
          NODE
          )"
            echo "poll ${i}/8: ${SNAPSHOT}"
            STATUS="$(printf '%s' "$SNAPSHOT" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).status||'none')}catch{console.log('parse-error')}})")"
            if [ "$STATUS" = "done" ] || [ "$STATUS" = "error" ] || [ "$STATUS" = "cancelled" ]; then
              break
            fi
            if [ "$STATUS" = "none" ]; then
              EMPTY_POLLS=$((EMPTY_POLLS + 1))
              if [ "$EMPTY_POLLS" -ge 2 ]; then
                break
              fi
            else
              EMPTY_POLLS=0
            fi
            sleep 30
          done

          echo "=== Aurel live smoke: durable state + blockers ==="
          docker exec -i mailer-backend node - <<'NODE'
          const Database = require('better-sqlite3');
          const db = new Database('/app/data/mailer.sqlite', { readonly: true });
          const job = db.prepare(`
            SELECT id, status, listName, found, merged, skipped, searches, scrapes,
                   message, createdAt, finishedAt, aurelProductName, aurelActivity,
                   aurelCampaignIds, aurelPostProcessedAt, results
            FROM discovery_jobs
            WHERE listName LIKE 'Aurel acquisition · %'
            ORDER BY createdAt DESC
            LIMIT 1
          `).get();

          const report = {
            latestAcquisition: null,
            candidateStats: null,
            campaigns: [],
            sendCounts: {},
            recentAurelActions: [],
            blockers: {},
          };

          if (job) {
            let campaignIds = [];
            try { campaignIds = JSON.parse(job.aurelCampaignIds || '[]'); } catch {}
            report.latestAcquisition = {
              id: job.id,
              status: job.status,
              listName: job.listName,
              product: job.aurelProductName,
              activity: job.aurelActivity,
              found: job.found,
              merged: job.merged,
              skipped: job.skipped,
              searches: job.searches,
              scrapes: job.scrapes,
              message: job.message,
              createdAt: job.createdAt,
              finishedAt: job.finishedAt,
              postProcessedAt: job.aurelPostProcessedAt,
              campaignCount: campaignIds.length,
            };

            let resultEnvelope = { prospects: [] };
            try { resultEnvelope = JSON.parse(job.results || '{"prospects":[]}'); } catch {}
            const createdIds = [...new Set((resultEnvelope.prospects || []).filter(p => p && p.created).map(p => p.id).filter(Boolean))];
            const stats = {
              createdProspects: createdIds.length,
              recommendationsPresent: 0,
              highConfidence: 0,
              score70Plus: 0,
              highAnd70Plus: 0,
              acceptedOrOverridden: 0,
              unreviewed: 0,
              noRecommendation: 0,
              suppressed: 0,
              byConfidence: {},
              bySuggestedProduct: {},
              byFinalProduct: {},
              scoreBands: { '0-39': 0, '40-69': 0, '70-100': 0 },
            };

            if (createdIds.length) {
              const placeholders = createdIds.map(() => '?').join(',');
              const candidates = db.prepare(`
                SELECT id, productRecommendation, leadStatus, marketId,
                       unsubscribedAt, replyDetectedAt
                FROM prospects
                WHERE id IN (${placeholders})
              `).all(...createdIds);

              for (const row of candidates) {
                if (row.unsubscribedAt || row.replyDetectedAt || ['won', 'lost'].includes(row.leadStatus)) {
                  stats.suppressed += 1;
                }
                let rec = null;
                try { rec = JSON.parse(row.productRecommendation || 'null'); } catch {}
                if (!rec) {
                  stats.noRecommendation += 1;
                  continue;
                }
                stats.recommendationsPresent += 1;
                const confidence = String(rec.confidence || 'unknown');
                stats.byConfidence[confidence] = (stats.byConfidence[confidence] || 0) + 1;
                const suggested = String(rec.suggestedProductId || 'none');
                stats.bySuggestedProduct[suggested] = (stats.bySuggestedProduct[suggested] || 0) + 1;
                const finalProduct = String(rec.productId || 'none');
                stats.byFinalProduct[finalProduct] = (stats.byFinalProduct[finalProduct] || 0) + 1;
                const score = Math.max(0, Math.min(100, Number(rec.score) || 0));
                if (score < 40) stats.scoreBands['0-39'] += 1;
                else if (score < 70) stats.scoreBands['40-69'] += 1;
                else stats.scoreBands['70-100'] += 1;
                if (confidence === 'high') stats.highConfidence += 1;
                if (score >= 70) stats.score70Plus += 1;
                if (confidence === 'high' && score >= 70) stats.highAnd70Plus += 1;
                if (['accepted', 'overridden'].includes(rec.reviewState)) stats.acceptedOrOverridden += 1;
                if (rec.reviewState === 'unreviewed') stats.unreviewed += 1;
              }
            }
            report.candidateStats = stats;

            if (campaignIds.length) {
              const placeholders = campaignIds.map(() => '?').join(',');
              report.campaigns = db.prepare(`
                SELECT id, name, status, createdAt, updatedAt
                FROM campaigns
                WHERE id IN (${placeholders})
                ORDER BY createdAt ASC
              `).all(...campaignIds);
              report.sendCounts = Object.fromEntries(
                db.prepare(`
                  SELECT campaignId, status, COUNT(*) AS count
                  FROM sends
                  WHERE campaignId IN (${placeholders})
                  GROUP BY campaignId, status
                `).all(...campaignIds).map(r => [`${r.campaignId}:${r.status}`, r.count])
              );
            }
          }

          report.recentAurelActions = db.prepare(`
            SELECT actionType, status, summary, createdAt
            FROM aurel_action_logs
            ORDER BY createdAt DESC
            LIMIT 20
          `).all();

          const settingsRow = db.prepare(`SELECT "values" AS settings_json FROM app_settings WHERE id = 'default'`).get();
          let settings = {};
          try { settings = JSON.parse(settingsRow?.settings_json || '{}'); } catch {}
          const marketRows = db.prepare(`
            SELECT productId, marketId, enabled, autopilotEnabled, currency
            FROM product_market_settings
            WHERE marketId = 'pf'
            ORDER BY productId
          `).all();
          const senderCounts = db.prepare(`
            SELECT COUNT(*) AS total,
                   SUM(CASE WHEN isDefault = 1 THEN 1 ELSE 0 END) AS defaults
            FROM sender_identities
          `).get();
          const recentJobs = db.prepare(`
            SELECT status, listName, found, searches, createdAt, finishedAt
            FROM discovery_jobs
            ORDER BY createdAt DESC
            LIMIT 5
          `).all();
          const searchKeys = [
            'tavilyApiKey', 'youApiKey', 'nimbleApiKey',
            'firecrawlApiKey', 'serpapiApiKey', 'exaApiKey'
          ];
          const envConfigured = Boolean(
            process.env.TAVILY_API_KEY || process.env.YDC_API_KEY || process.env.YOU_API_KEY ||
            process.env.NIMBLE_API_KEY || process.env.FIRECRAWL_API_KEY ||
            process.env.SERPAPI_API_KEY || process.env.EXA_API_KEY
          );

          report.blockers = {
            acquisitionPolicy: {
              enabled: settings.aurelAcquisitionEnabled !== false,
              minHours: Number(settings.aurelAcquisitionMinHours || 12),
              maxRuns24h: Number(settings.aurelAcquisitionMaxRuns24h || 2),
              autoAcceptHighConfidence: settings.aurelAcquisitionAutoAcceptHighConfidence !== false,
            },
            pfMarkets: marketRows,
            senderCounts,
            searchProviderConfigured: envConfigured || searchKeys.some(k => typeof settings[k] === 'string' && settings[k].trim()),
            recentJobs,
          };

          console.log(JSON.stringify(report, null, 2));
          NODE

          echo "=== Aurel live smoke: relevant backend logs ==="
          docker logs --since 12m mailer-backend 2>&1 \
            | grep -E 'Aurel acquisition|Acquisition tick|campaign|autopilot|Reply|follow-up|quota|provider' \
            | tail -n 220 || true
          REMOTE
